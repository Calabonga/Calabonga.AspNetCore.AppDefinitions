name: Nuget Package (NET10)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore src/Calabonga.AspNetCore.AppDefinitions.slnx

      - name: Build the NuGet package
        run: dotnet build src/Calabonga.AspNetCore.AppDefinitions/Calabonga.AspNetCore.AppDefinitions.csproj --configuration Release --no-restore --output ${{ github.workspace }}\Package

      - name: Publish NuGet Package
        run: dotnet nuget push ${{ github.workspace }}\Package\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
